name: Build ESP32 CYD Firmware

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e esp32dev

      - name: Prepare firmware
        run: |
          mkdir -p firmware
          cp .pio/build/esp32dev/firmware.bin firmware/aquarium-controller.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Aquarium-Firmware
          path: firmware/aquarium-controller.bin
          if-no-files-found: error
