name: Build ESP32 CYD Firmware
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build
        run: pio run -e esp32-cyd
      - name: Prepare firmware
        run: cp .pio/build/esp32-cyd/firmware.bin aquarium-controller.bin
      - uses: actions/upload-artifact@v4
        with:
          name: aquarium-controller-firmware
          path: aquarium-controller.bin
